  <div class="page-head">
    <h1>Get in touch</h1>
    <p class="page-lede">Commissions, collaborations, or just a chat about cars and hills. Send me a message below, email <a href="mailto:andy@ajwb.co.uk" style="color: var(--accent);">andy@ajwb.co.uk</a>, or find me on <a href="https://uk.linkedin.com/in/theandrewbrady" target="_blank" rel="noopener" style="color: var(--accent);">LinkedIn</a>.</p>
  </div>

  <section id="contact" style="padding-top: 0; border-top: none;">
    <form class="contact-form" action="https://formspree.io/f/mkoyaykz" method="POST" onsubmit="handleSubmit(event)">
      <div class="form-row">
        <div class="form-group">
          <label for="cf-name">Name</label>
          <input type="text" id="cf-name" name="name" placeholder="Your name" required />
        </div>
        <div class="form-group">
          <label for="cf-email">Email</label>
          <input type="email" id="cf-email" name="email" placeholder="your@email.com" required />
        </div>
      </div>
      <div class="form-group">
        <label for="cf-message">Message</label>
        <textarea id="cf-message" name="message" rows="5" placeholder="What&apos;s on your mind?" required></textarea>
      </div>
      <button type="submit" class="form-submit">Send message &rarr;</button>
      <p class="form-confirmation" id="form-confirmation">Thanks - I&apos;ll be in touch soon.</p>
    </form>
    <div class="contact-socials">

<script>
    function handleSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const btn = form.querySelector('.form-submit');
      const confirmation = document.getElementById('form-confirmation');
      btn.textContent = 'Sending…';
      btn.disabled = true;
      fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      }).then(res => {
        if (res.ok) {
          form.reset();
          btn.style.display = 'none';
          confirmation.style.display = 'block';
        } else {
          btn.textContent = 'Something went wrong — please try again, or email andy@ajwb.co.uk.';
          btn.disabled = false;
        }
      }).catch(() => {
        btn.textContent = 'Something went wrong — please try again, or email andy@ajwb.co.uk.';
        btn.disabled = false;
      });
    }
    </script>
